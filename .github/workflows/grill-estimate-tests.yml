name: Grill Estimate and SEO Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "*.html"
      - "assets/**"
      - "tests/**"
      - "robots.txt"
      - "sitemap.xml"
      - "schema.json"
      - "ai-context.json"
      - ".github/MR-SPRINKLE-SEO-AIO-GEO-STANDARD.md"
      - ".github/workflows/grill-estimate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-regression:
    name: Verify grill pricing, SEO metadata, and discoverability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run site regression tests
        run: node --test tests/grill-estimate.test.js tests/site-seo.test.js
