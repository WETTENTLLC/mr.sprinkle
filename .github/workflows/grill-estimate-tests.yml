name: Grill Estimate Tests

on:
  push:
    branches:
      - feature/grill-maker-pricing-location
  pull_request:
    branches:
      - master
    paths:
      - "assets/**"
      - "tests/**"
      - ".github/workflows/grill-estimate-tests.yml"

permissions:
  contents: read

jobs:
  grill-estimate:
    name: Verify grill pricing and estimate calculations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run grill estimate tests
        run: node --test tests/
