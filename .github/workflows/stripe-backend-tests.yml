name: Stripe backend tests

on:
  pull_request:
    branches: [master]
    paths:
      - "stripe-backend/**"
  push:
    branches: [feat/stripe-sandbox-backend]
    paths:
      - "stripe-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stripe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run pricing and checkout-safety tests
        run: npm test
