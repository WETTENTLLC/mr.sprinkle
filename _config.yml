# GitHub Pages builds this repository with Jekyll. Keep backend and operational
# files out of the public artifact; robots.txt is discovery guidance, not auth.
exclude:
  - "*.php"
  - "**/*.php"
  - "*.sql"
  - "**/*.sql"
  - "*.md"
  - "**/*.md"
  - "*.bat"
  - "**/*.bat"
  - "*.pdf"
  - "**/*.pdf"
  - "*.zip"
  - "**/*.zip"
  - "admin-dashboard.html"
  - "ai-sales-coach-24-7-final.html"
  - "site-check.html"
  - "test-script.html"
  - "original_index.html"
  - "squarespace-ambassador-system.html"
  - "squarespace-booking-form.html"
  - "entries.json"
  - "live-prospects.json"
  - "ambassador-welcome-emails.txt"
  - "entry-tracking-setup.js"
  - "google-apps-script.js"
  - "scripts/"
  - "tests/"
  - "node_modules/"
  - "package.json"
  - "package-lock.json"
  - ".github/"
